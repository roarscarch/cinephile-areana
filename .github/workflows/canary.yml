name: canary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every 30 min — upstream embed APIs rename hosts/slugs without warning.
    # The canary races real titles through /sources on every deployment; if
    # all three go dark simultaneously, an upstream changed (not our code).
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-upstreams-sync.mjs

  unit:
    runs-on: ubuntu-latest
    needs: sync-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  canary:
    runs-on: ubuntu-latest
    needs: unit
    # Scheduled runs probe production even without a code change.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Probe all deployments
        env:
          CANARY_BASES: https://cinephiles-areana.vercel.app,https://cinephile-areana.pages.dev,https://cinephile-api.cinephilia-areana.workers.dev
        run: node scripts/check-upstreams.mjs
