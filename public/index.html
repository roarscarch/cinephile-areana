<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinephiles Areana</title>
  <meta name="description" content="Stream movies and TV shows instantly. Search, browse, and watch in HD." />
  <meta name="theme-color" content="#0a0a12" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="dns-prefetch" href="https://image.tmdb.org" />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://x.eat-peach.sbs" />
  <link rel="dns-prefetch" href="https://new.vidnest.fun" />
  <link rel="dns-prefetch" href="https://cinephile-play.cinephilia-areana.workers.dev" />
  <link rel="preconnect" href="https://cinephile-play.cinephilia-areana.workers.dev" crossorigin />
  <!-- Outfit is self-hosted now (see @font-face in style.css): same-origin
       variable woff2 (all weights in ONE 32 KB file), no
       fonts.googleapis.com / fonts.gstatic.com round-trip on the critical
       path, and the service worker caches it. crossorigin is required on font
       preloads even for same-origin files (font fetches are CORS-mode). -->
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/style.css?v=4" />
  <script>
    // The server SSRs the HOME view into <main id="view"> for every '/' request,
    // and the URL hash is never sent to the server — so on a deep link
    // (#/watch/…, #/movies, #/search) that markup is already stale when the
    // document is parsed. It used to stay visible until router.js (the last
    // script on the page) swapped in the real view, so refreshing a watch page
    // flashed the home page first. Mark the document BEFORE the body is parsed
    // so the CSS below hides it from the very first paint; the router removing
    // `data-ssr-home` afterwards makes the rule inert.
    try {
      if (location.hash.replace(/^#\/?/, '')) document.documentElement.classList.add('no-ssr');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="nav" id="nav">
      <a class="brand" href="#/">Cinephiles Areana</a>
      <nav class="nav-links" id="navLinks">
        <a href="#/movies" data-nav="movies">Movies</a>
        <a href="#/tv-shows" data-nav="tv">TV Shows</a>
        <a href="#/top-rated" data-nav="top">Top Rated</a>
        <a href="#/imdb75" data-nav="imdb75">IMDb 7.5+</a>
      </nav>
      <div class="search-box" id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="navSearch" type="text" placeholder="Search movies &amp; shows…" autocomplete="off" spellcheck="false" />
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
      <button class="icon-btn" id="searchToggle" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </header>

    <main id="view"></main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- hls.js is NOT here — it's lazy-loaded only when a watch page opens
       (browse/search pages skip ~400KB of parsing) -->
  <!-- ?v= busts the service-worker/HTTP caches on release — bump alongside sw.js CACHE -->
  <script src="/js/api.js?v=21"></script>
  <script src="/js/player.js?v=27"></script>
  <!-- render.js must load before router.js (shared SSR/client markup helpers) -->
  <script src="/js/render.js?v=20"></script>
  <script src="/js/router.js?v=23"></script>
  <script>
    // PWA: register the service worker (installable app + cached shell)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
